[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-server"
version = "1.0.0"
description = "Server that distributes the scans of a BoneHub-format database to reviewers in the browser and editors in 3D Slicer, and writes approved verdicts into it."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Hamid Alavi"}
]

# The BoneHub format is taken from BoneHub-Format, with its [io] extra (numpy and SimpleITK)
# for reading and writing .seg.nrrd segmentations; none of its converter stack is pulled in.
# It is pinned to a release, the source archive of the format's tag v1.0.0, so that every
# install of the server reads databases with the same format, whatever reaches the format's
# main branch later; to take a newer release, change the tag. An archive rather than
# git+https: pip clones a git URL with its submodules, and the repository's converters are a
# private submodule, which an archive leaves out. The server's major version is the format's:
# server 1.x reads format 1.x, and refuses to start with another (see config.WRITTEN_FOR_FORMAT),
# so a new major version of the format takes a new major version of the server. matplotlib draws
# the figures of a reliability study's report (qc_server.study.report).
dependencies = [
    "bonehub-format[io] @ https://github.com/BoneHub/BoneHub-Format/archive/refs/tags/v1.0.0.zip",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "numpy>=1.24",
    "SimpleITK>=2.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# The test suite is plain unittest (python -m unittest discover -s tests); httpx is what
# fastapi.testclient needs to drive the app in-process.
dev = [
    "httpx>=0.27",
]

[project.scripts]
bonehub-qc-server = "qc_server.__main__:main"

[tool.setuptools.packages.find]
include = ["qc_server*"]

# The admin panel and the review page are served from these files at run time, so they must
# be installed with the package; tests/test_review_page.py checks nothing under static/ is missed.
[tool.setuptools.package-data]
qc_server = ["static/*.html", "static/*.js", "static/*.css", "static/*.svg", "static/vendor/*"]

